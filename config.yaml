benchmark_cedear: {cedear: SPY.BA, ratio: 60}

# ---------------------------------------------------------------------
# CEDEARs EN PESOS (cedears.py)
# ratio = cuántos CEDEARs equivalen a 1 acción (fuente: tabla oficial de ratios, 02/09/2026).
# El agente calcula el dólar CCL implícito de cada CEDEAR; si uno se aleja mucho de la mediana,
# lo marca "a revisar" (ratio cambiado o precio viejo) y no lo usa.
# ---------------------------------------------------------------------
cedears:
  prima_caro: 0.015              # CCL implícito 1,5% arriba de la mediana -> CEDEAR "caro"
  prima_barato: -0.015           # 1,5% abajo -> "barato"
  desvio_revisar: 0.10           # más de 10% de diferencia -> ratio o precio a revisar
  dias_max_precio: 5             # precio en pesos con más de 5 días de antigüedad -> no se usa

# ---------------------------------------------------------------------
# BACKTEST (Etapa 3): variantes a comparar además de la configuración base
# ---------------------------------------------------------------------
backtest:
  variantes_riesgo: [0.005, 0.01, 0.02]
  # Calibración: se prueban todas las combinaciones de la grilla.
  # Se elige mirando SOLO el período "dentro de muestra" (antes de esta fecha)
  # y después se verifica en el período "fuera de muestra" (datos no usados para elegir).
  inicio_fuera_de_muestra: "2023-01-01"
  grilla:
    entrada: [retroceso, ruptura_20, ruptura_55]
    objetivo_r: [3.0, 5.0]
    max_dias_en_posicion: [20, 40]
    filtro_mercado: [true, false]

# ---------------------------------------------------------------------
# DATOS
# ---------------------------------------------------------------------
datos:
  historia_anios: 10             # 10 años: incluye 2018, 2020 y 2022 (mercados bajistas)
  base_precios: data/precios.db  # precios (NO se sube a GitHub; se guarda en caché)
  base_diario: data/diario.db    # versiones, decisiones y operaciones (SÍ se sube)

# ---------------------------------------------------------------------
# ESTRATEGIA (se usa en la Etapa 2)
# Idea base: "comprar retrocesos dentro de una tendencia alcista"
# ---------------------------------------------------------------------
estrategia:
  entrada: retroceso             # retroceso | ruptura_20 | ruptura_55 (ver estrategia.py)
  sma_rapida: 50                 # media móvil corta
  sma_lenta: 200                 # media móvil larga -> filtro de tendencia
  rsi_periodo: 14
  rsi_entrada_max: 40            # entra solo si el RSI retrocedió por debajo de esto...
  rsi_confirmacion: true         # ...y hoy vuelve a subir (rebote)
  volumen_min_rel: 0.8           # volumen de hoy >= 0.8x su promedio de 20 ruedas
  filtro_mercado: false          # operar solo si el benchmark (SPY) está sobre su media...
  sma_mercado: 200               # ...de 200 ruedas (evita comprar en mercados bajistas)
  fuerza_relativa_dias: null     # ej. 126 = solo papeles que le ganaron al SPY en los últimos ~6 meses. null = apagado

# ---------------------------------------------------------------------
# MOMENTUM - "booms del momento" (momentum.py)
# Rotación: cada `rebalanceo_dias` ruedas se queda con las `top_n` acciones
# que más subieron. Siempre 100% invertido (lo que sobra va a SPY).
# ---------------------------------------------------------------------
momentum:
  nombre: "m4-ampliado-top5-mensual-tope25"
  # Elegido con el backtest de 10 años (ver reportes/momentum.md, "Qué pesa más"):
  #  - sin filtro de mercado: estar 100% invertido rindió más antes y después de 2023
  #  - top 5: más retorno que 8 o 10 en los dos períodos (ojo: caídas más profundas)
  #  - puntaje mix: el mejor período cambió entre antes y después de 2023; mix combina 3, 6 y 12 meses
  #  - revisión mensual: semanal vs mensual y el buffer dieron diferencias chicas (ruido);
  #    mensual opera menos (~14 compras/año)
  puntaje: mix                   # r21 (1 mes) | r63 (3 meses) | r126 (6-1) | r252 (12-1) | mix
  top_n: 5                       # cuántas acciones tener (cada una ~1/5 del capital)
  rebalanceo_dias: 21            # cada cuántas ruedas se revisa el ranking (5 = semanal, 21 = mensual)
  buffer: 5                      # una acción que ya tenemos se queda mientras esté en el top_n + buffer
  max_por_sector: 3              # null = sin límite
  universo: ampliado             # base = las 50 de arriba · ampliado = + universo_ampliado.csv (~190 CEDEARs)
  liquidez_min_usd: 20000000     # solo acciones con más de USD 20 M operados por día (mediana 60 ruedas)
  max_peso: 0.25                 # en cada revisión, ninguna acción puede pesar más de 25% (se recorta el excedente)
  filtro_mercado: false          # true = pasar a efectivo si SPY < media de 200 (deja de estar 100% invertido)
  grilla:                        # combinaciones que prueba la calibración (se descartaron r21, r63 y el filtro)
    puntaje: [mix, r126, r252]
    top_n: [5, 8, 10]
    rebalanceo_dias: [5, 21]
    buffer: [5, 10]
    max_por_sector: [null, 3]

# ---------------------------------------------------------------------
# GESTIÓN DE RIESGO (se usa en las Etapas 2-4)
# ---------------------------------------------------------------------
riesgo:
  capital_inicial_usd: 10000
  riesgo_por_operacion: 0.01     # arriesgar 1% del capital por trade
  atr_periodo: 14
  stop_atr: 2.0                  # stop = entrada - 2 x ATR
  objetivo_r: 4.0                # take profit = 4 veces lo arriesgado (4R) · v4: mejor dentro y fuera de muestra
  trailing_atr: null             # ej. 3.0 = el stop sube detrás del precio (máximo - 3xATR). null = apagado
  max_dias_en_posicion: 20       # salida por tiempo (swing = días/semanas) · v3: 20 le ganó a 10 y 15
  max_posiciones: 5
  max_por_sector: 2              # evita tener 5 posiciones que se mueven igual
  max_pct_posicion: 0.25         # ninguna posición puede superar el 25% del capital
  efectivo_en_spy: false         # true = la plata que no está en posiciones queda en SPY (ver reporte: con 0,15% de comisión por mover SPY en cada operación, en swing puede no convenir)
  comision_pct: 0.0015           # comisión por operación (cada compra y cada venta): 0,15%
