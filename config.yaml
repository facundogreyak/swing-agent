# =====================================================================
#  AGENTE SWING TRADING - PARÁMETROS
#  Todo lo que el agente "decide" sale de acá. Si cambiás algo, el
#  agente guarda una nueva VERSIÓN de parámetros, así después podés
#  comparar qué configuración rindió mejor.
# =====================================================================

nombre_version: "v1-base"        # ponele un nombre cada vez que cambies algo

