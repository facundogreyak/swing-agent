benchmark: SPY                   # contra qué medimos si el agente agrega valor

# ---------------------------------------------------------------------
# BACKTEST (Etapa 3): variantes a comparar además de la configuración base
# ---------------------------------------------------------------------
backtest:
  variantes_riesgo: [0.005, 0.01, 0.02]
  # Calibración: se prueban todas las combinaciones de la grilla.
  # Se elige mirando SOLO el período "dentro de muestra" (antes de esta fecha)
  # y después se verifica en el período "fuera de muestra" (datos no usados para elegir).
  inicio_fuera_de_muestra: "2023-01-01"
  grilla:
    objetivo_r: [1.5, 2.0, 3.0]
    max_dias_en_posicion: [10, 15, 20]
    trailing_atr: [null, 3.0]
    filtro_mercado: [true, false]

# ---------------------------------------------------------------------
# DATOS
# ---------------------------------------------------------------------
datos:
  historia_anios: 10             # 10 años: incluye 2018, 2020 y 2022 (mercados bajistas)
  base_precios: data/precios.db  # precios (NO se sube a GitHub; se guarda en caché)
  base_diario: data/diario.db    # versiones, decisiones y operaciones (SÍ se sube)

# ---------------------------------------------------------------------
# ESTRATEGIA (se usa en la Etapa 2)
# Idea base: "comprar retrocesos dentro de una tendencia alcista"
# ---------------------------------------------------------------------
estrategia:
  sma_rapida: 50                 # media móvil corta
  sma_lenta: 200                 # media móvil larga -> filtro de tendencia
  rsi_periodo: 14
  rsi_entrada_max: 40            # entra solo si el RSI retrocedió por debajo de esto...
  rsi_confirmacion: true         # ...y hoy vuelve a subir (rebote)
  volumen_min_rel: 0.8           # volumen de hoy >= 0.8x su promedio de 20 ruedas
  filtro_mercado: true           # operar solo si el benchmark (SPY) está sobre su media...
  sma_mercado: 200               # ...de 200 ruedas (evita comprar en mercados bajistas)

# ---------------------------------------------------------------------
# GESTIÓN DE RIESGO (se usa en las Etapas 2-4)
# ---------------------------------------------------------------------
riesgo:
  capital_inicial_usd: 10000
  riesgo_por_operacion: 0.01     # arriesgar 1% del capital por trade
  atr_periodo: 14
  stop_atr: 2.0                  # stop = entrada - 2 x ATR
  objetivo_r: 2.0                # take profit = 2 veces lo arriesgado (2R)
  trailing_atr: null             # ej. 3.0 = el stop sube detrás del precio (máximo - 3xATR). null = apagado
  max_dias_en_posicion: 15       # salida por tiempo (swing = días/semanas)
  max_posiciones: 5
  max_por_sector: 2              # evita tener 5 posiciones que se mueven igual
  max_pct_posicion: 0.25         # ninguna posición puede superar el 25% del capital
  comision_pct: 0.0015           # comisión por operación (cada compra y cada venta): 0,15%
