name: Agente diario

on:
  schedule:
    - cron: "30 21 * * 1-5"      # 18:30 hora Argentina, lunes a viernes
  workflow_dispatch: {}          # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: ["**.py", "config.yaml", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # siempre la última versión del repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar precios guardados (caché)
        uses: actions/cache@v4
        with:
          path: data/precios.db
          key: precios-${{ github.run_id }}
          restore-keys: precios-
      - name: Ejecutar agente
        run: |
          mkdir -p reportes data docs
          python run_diario.py 2>&1 | tee reportes/ultima_corrida.log
      - name: Guardar resultados en el repo
        run: |
          git config user.name "agente-bot"
          git config user.email "agente-bot@users.noreply.github.com"
          git add -A reportes docs
          if [ -f data/diario.db ]; then git add data/diario.db; fi
          git rm -q --cached --ignore-unmatch data/agente.db
          git diff --cached --quiet || git commit -m "Corrida $(date -u +%F) [skip ci]"
          git pull --rebase -q && git push
